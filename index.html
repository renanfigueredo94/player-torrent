<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Torrent</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101418;color:#eff5f4;font:16px/1.5 "Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:5vh 20px}h1{letter-spacing:-.045em;font-size:clamp(2rem,5vw,3.4rem);margin:0 0 1rem}form{display:flex;gap:8px;flex-wrap:wrap}input,button,select{font:inherit;border-radius:8px;padding:10px 14px;border:1px solid #576264;color:inherit;background:#20292a}input{min-width:0;flex:1 1 260px}button{cursor:pointer}button[type=submit]{background:#a0ecd4;color:#102822;font-weight:650}video{display:block;width:100%;aspect-ratio:16/9;background:#050708;border-radius:12px;margin:18px 0}small{color:#aed4ca}select{max-width:100%}p{margin:.65em 0}
</style>
<main><h1>Player Torrent</h1>
<form><input id="magnet" aria-label="Link magnet" placeholder="Cole o link magnet" required><button type="submit">Reproduzir</button></form>
<p><button id="demo">Testar com Sintel</button> <button id="stop" hidden>Parar</button></p>
<p id="files" hidden><label>Vídeo <select id="choice"></select></label></p>
<div id="screen"><video controls playsinline aria-label="Reprodutor de vídeo"></video></div>
<p id="status" role="status">Aguardando um magnet.</p><small id="stats"></small></main>
<script type="module">
const engine = import('./webtorrent.min.js')
async function prepareStream() {
  await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'})
  const registration = await navigator.serviceWorker.ready
  if (!navigator.serviceWorker.controller)
    await new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}))
  const worker = registration.active
  if (worker.state !== 'activated') await new Promise((resolve,reject) => {
    worker.addEventListener('statechange', () => {
      if(worker.state === 'activated') resolve()
      if(worker.state === 'redundant') reject(new Error('Falha ao ativar o streaming.'))
    })
  })
  return registration
}
const setup = Promise.all([engine,prepareStream()])
setup.catch(()=>{})
let generation = 0
const metadata = new Map()
const el = id => document.getElementById(id)
let client, torrent, videos = []
const statusText = msg => { el('status').textContent = msg }
function stop(){
  generation++
  const old = client
  client = torrent = null
  videos = []
  if(old && !old.destroyed) old.destroy()
  const video = document.querySelector('video')
  video.pause()
  video.removeAttribute('src')
  video.load()
  el('choice').replaceChildren()
  el('files').hidden = el('stop').hidden = true
  el('stats').textContent = ''
}
function showVideo(){
  const file = videos[Number(el('choice').value)]
  const video = document.createElement('video')
  video.controls = video.playsInline = true
  video.setAttribute('aria-label',file.name)
  el('screen').replaceChildren(video)
  const current = () => client && video.isConnected
  const fail = () => { if(current()) statusText('Falha ao reproduzir. Confira as fontes ou escolha outro vídeo.') }
  video.onerror = fail
  video.onplaying = () => { if(current()) statusText(file.name) }
  video.oncanplay = () => { if(current() && video.paused) statusText('Vídeo pronto. Toque em reproduzir.') }
  statusText('Carregando o vídeo…')
  video.preload = 'auto'
  video.src = file.streamURL
  video.play().catch(err => {
    if(current() && err.name === 'NotAllowedError') statusText('Vídeo pronto. Toque em reproduzir.')
  })
}
async function start(){
  const magnet = el('magnet').value.trim()
  if(!/^magnet:\?/i.test(magnet) || !new URLSearchParams(magnet.slice(8)).getAll('xt').some(xt=>/^urn:btih:(?:[a-f0-9]{40}|[a-z2-7]{32})$/i.test(xt))){
    el('magnet').setCustomValidity('Insira um magnet válido com identificador BitTorrent v1.')
    el('magnet').reportValidity()
    return
  }
  stop()
  const attempt = generation
  statusText('Preparando a conexão…')
  el('stop').hidden = false
  try{
    const [{default: WebTorrent}, registration] = await setup
    if(attempt !== generation) return
    const session = client = new WebTorrent()
    // An update may replace the active worker between page load and pressing Play.
    const deadline = Date.now() + 12000
    while (registration.active?.state !== 'activated') {
      if (Date.now() >= deadline) throw new Error('Recarregue a página para ativar o streaming.')
      await new Promise(resolve => setTimeout(resolve,100))
      if (attempt !== generation) return
    }
    session.createServer({controller:registration})
    const fail = () => { if(client === session){ stop(); statusText('Falha na conexão com o torrent. Tente novamente.') } }
    session.on('error',fail)
    el('stop').hidden = false
    statusText('Procurando fontes e informações do torrent…')
    const params = new URLSearchParams(magnet.slice(8))
    const key = magnet
    const options = {deselect:true, strategy:'sequential'}
    if(!params.getAll('tr').some(url=>/^wss:/i.test(url))) options.announce = ['wss://tracker.openwebtorrent.com','wss://tracker.webtorrent.dev']
    torrent = session.add(metadata.get(key) || magnet,options,item=>{
      if(session !== client) return
      if(!item.private && item.torrentFile?.length <= 2000000){
        metadata.set(key,item.torrentFile)
        if(metadata.size > 8) metadata.delete(metadata.keys().next().value)
      }
      videos = item.files.filter(f=>/\.(mp4|m4v|webm|ogv|mov|mkv|avi)$/i.test(f.name)).sort((a,b)=>b.length-a.length)
      if(!videos.length){ stop(); statusText('Nenhum arquivo de vídeo encontrado.'); return }
      videos.forEach((f,i)=>el('choice').add(new Option(f.name,i)))
      el('files').hidden = videos.length < 2
      showVideo()
    })
    torrent.on('error',fail)
  }catch(error){ if(attempt !== generation) return; stop(); statusText('Falha ao abrir o torrent. ' + error.message) }
}
document.querySelector('form').onsubmit = event => { event.preventDefault(); start() }
el('magnet').oninput = () => el('magnet').setCustomValidity('')
el('choice').onchange = showVideo
el('stop').onclick = () => { stop(); statusText('Reprodução encerrada.') }
el('demo').onclick = () => {
  el('magnet').value = 'magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=wss://tracker.openwebtorrent.com&tr=wss://tracker.webtorrent.dev&ws=https://webtorrent.io/torrents/&xs=https://webtorrent.io/torrents/sintel.torrent'
  el('magnet').setCustomValidity('')
  start()
}
setInterval(()=>{
  if(torrent) el('stats').textContent = torrent.numPeers+' conexões · '+Math.round(torrent.downloadSpeed/1024)+' KiB/s · '+Math.floor(torrent.progress*100)+'% recebido'
},1000)
</script>
</html>
